<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🤖 자비스 — 실시간 채팅관리 · AI 학습</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.7/dist/umd/supabase.min.js"></script>

    <style>
        * { box-sizing: border-box; }
        body {
            background: #0b0f1c; color: #e2e8f0;
            font-family: 'Pretendard', sans-serif;
            margin: 0; padding: 16px 14px 60px;
            max-width: 1080px; margin: 0 auto;
            min-height: 100vh; -webkit-font-smoothing: antialiased;
        }
        .header { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
        .header h1 { font-size: 19px; font-weight: 900; color: #fff; margin: 0; letter-spacing: -0.5px; }
        .header .sub { font-size: 11px; color: #94a3b8; font-weight: 600; margin-top: 2px; }
        .refresh-btn, .alarm-btn {
            background: rgba(255,255,255,0.06); border: 1px solid rgba(148,163,184,0.2);
            height: 40px; min-width: 40px; padding: 0 10px; border-radius: 12px;
            display: flex; align-items: center; justify-content: center; gap: 6px;
            color: #cbd5e1; cursor: pointer; font-size: 14px; font-weight: 700;
            transition: all 0.15s;
        }
        .refresh-btn:active, .alarm-btn:active { transform: scale(0.94); }
        .alarm-btn.on { background: rgba(34,197,94,0.15); color: #86efac; border-color: rgba(34,197,94,0.4); }
        .alarm-btn.off { background: rgba(239,68,68,0.12); color: #fca5a5; border-color: rgba(239,68,68,0.35); }

        /* 탭 */
        .tabs { display: flex; gap: 8px; margin-bottom: 14px; }
        .tab {
            flex: 1; text-align: center; padding: 11px 8px; border-radius: 12px; cursor: pointer;
            font-size: 13.5px; font-weight: 800; letter-spacing: -0.3px;
            background: rgba(255,255,255,0.05); color: #94a3b8; border: 1px solid rgba(148,163,184,0.15);
            transition: all 0.15s; position: relative;
        }
        .tab.active { background: linear-gradient(135deg,#6366f1,#4f46e5); color: #fff; border-color: transparent; }
        .tab .tcount { font-size: 11px; margin-left: 4px; opacity: 0.85; }
        .tab-dot { display:inline-block; width:8px; height:8px; border-radius:50%; background:#ef4444; margin-left:6px; vertical-align:middle; animation: blink 1s infinite; }
        @keyframes blink { 50% { opacity: 0.3; } }

        .summary { display: flex; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; }
        .chip { background: rgba(99,102,241,0.18); color: #c7d2fe; padding: 6px 13px; border-radius: 18px; font-size: 12px; font-weight: 800; }
        .chip.warn { background: rgba(239,68,68,0.18); color: #fca5a5; }
        .chip.ok { background: rgba(34,197,94,0.18); color: #86efac; }

        .empty { text-align: center; padding: 70px 20px; color: #86efac; font-size: 16px; font-weight: 800; line-height: 1.6; }

        /* 라이브 방 목록 */
        .room {
            display: flex; align-items: center; gap: 12px; padding: 13px 14px; margin-bottom: 10px;
            background: linear-gradient(165deg,#1e293b 0%,#0f172a 100%);
            border: 1px solid rgba(148,163,184,0.15); border-radius: 14px; cursor: pointer;
            transition: transform 0.1s, border-color 0.15s;
        }
        .room:active { transform: scale(0.99); }
        .room.fresh { border-color: rgba(239,68,68,0.55); box-shadow: 0 0 0 1px rgba(239,68,68,0.35); }
        .room-av { width: 40px; height: 40px; border-radius: 12px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 900; background: linear-gradient(135deg,#6366f1,#8b5cf6); color: #fff; }
        .room-mid { flex: 1; min-width: 0; }
        .room-name { font-size: 14px; font-weight: 800; color: #f8fafc; display: flex; align-items: center; gap: 6px; }
        .room-prev { font-size: 12px; color: #94a3b8; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }
        .room-right { text-align: right; flex-shrink: 0; }
        .room-time { font-size: 11px; color: #64748b; }
        .badge-live { font-size: 10px; font-weight: 800; padding: 2px 7px; border-radius: 8px; background: rgba(34,197,94,0.2); color: #86efac; }
        .badge-new { font-size: 10px; font-weight: 800; padding: 2px 7px; border-radius: 8px; background: #ef4444; color: #fff; }

        /* 대화 오버레이 */
        .conv-ov { position: fixed; inset: 0; background: rgba(2,6,23,0.75); backdrop-filter: blur(3px); z-index: 9000; display: none; align-items: flex-end; justify-content: center; }
        .conv-ov.open { display: flex; }
        .conv-card { background: #0f172a; width: 100%; max-width: 680px; height: 92vh; border-radius: 20px 20px 0 0; display: flex; flex-direction: column; border: 1px solid rgba(148,163,184,0.2); }
        .conv-head { display: flex; align-items: center; gap: 10px; padding: 14px 16px; border-bottom: 1px solid rgba(148,163,184,0.15); }
        .conv-head .cn { flex: 1; font-size: 15px; font-weight: 900; color: #fff; }
        .conv-head .cx { background: none; border: none; color: #94a3b8; font-size: 24px; cursor: pointer; line-height: 1; }
        .conv-body { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
        .cmsg { max-width: 82%; padding: 9px 13px; border-radius: 14px; font-size: 13.5px; line-height: 1.5; word-break: break-word; white-space: pre-wrap; }
        .cmsg .cwho { font-size: 10.5px; font-weight: 800; opacity: 0.7; margin-bottom: 3px; }
        .cmsg .ct { font-size: 10px; opacity: 0.5; margin-top: 4px; }
        .cmsg.customer { align-self: flex-start; background: #1e293b; color: #e2e8f0; border-bottom-left-radius: 4px; }
        .cmsg.ai { align-self: flex-end; background: rgba(99,102,241,0.22); color: #dbeafe; border-bottom-right-radius: 4px; }
        .cmsg.mgr { align-self: flex-end; background: rgba(34,197,94,0.22); color: #dcfce7; border-bottom-right-radius: 4px; }
        .cmsg img { max-width: 180px; border-radius: 8px; margin-top: 6px; display: block; }
        .conv-foot { padding: 12px 14px; border-top: 1px solid rgba(148,163,184,0.15); }
        .join-bar { display: flex; gap: 8px; }
        .reply-wrap { display: none; gap: 8px; align-items: flex-end; }
        .reply-wrap.show { display: flex; }
        .reply-ta { flex: 1; border-radius: 12px; border: 1px solid rgba(148,163,184,0.3); background: rgba(255,255,255,0.06); color: #f8fafc; font-family: inherit; font-size: 14px; padding: 10px 12px; resize: none; min-height: 44px; max-height: 120px; line-height: 1.4; }
        .reply-ta:focus { outline: none; border-color: #34d399; }

        /* 학습 아이템 (기존) */
        .jx-item { background: linear-gradient(165deg,#1e1b4b 0%,#0f172a 100%); border: 1px solid rgba(148,163,184,0.15); border-radius: 16px; padding: 14px; margin-bottom: 14px; box-shadow: 0 8px 20px -8px rgba(0,0,0,0.4); transition: opacity 0.35s, transform 0.35s; }
        .jx-meta { display: flex; gap: 8px; align-items: center; margin-bottom: 10px; flex-wrap: wrap; }
        .jx-lang { font-size: 11px; font-weight: 800; padding: 3px 9px; border-radius: 7px; letter-spacing: 0.3px; }
        .jx-lang.kr { background: rgba(99,102,241,0.25); color: #c7d2fe; }
        .jx-lang.ja { background: rgba(236,72,153,0.25); color: #fbcfe8; }
        .jx-lang.us { background: rgba(34,197,94,0.25); color: #86efac; }
        .jx-time { font-size: 11px; color: #94a3b8; }
        .jx-convbtn { margin-left:auto; font-size:11px; font-weight:800; color:#93c5fd; background:rgba(59,130,246,0.14); border:1px solid rgba(59,130,246,0.3); border-radius:8px; padding:4px 9px; cursor:pointer; }
        .jx-q { font-size: 14px; font-weight: 700; color: #f8fafc; line-height: 1.5; margin-bottom: 6px; word-break: break-word; cursor:pointer; }
        .jx-q .lbl { color: #fca5a5; font-weight: 900; margin-right: 5px; font-size: 11px; vertical-align: 2px; }
        .jx-q-tr { font-size: 12.5px; color: #cbd5e1; line-height: 1.5; margin-bottom: 10px; padding: 8px 11px; background: rgba(99,102,241,0.08); border-left: 3px solid rgba(99,102,241,0.5); border-radius: 6px; word-break: break-word; }
        .jx-q-tr.loading { color: #64748b; font-style: italic; }
        .jx-a { font-size: 12.5px; color: #cbd5e1; line-height: 1.45; margin-bottom: 12px; padding: 8px 11px; background: rgba(239,68,68,0.08); border-left: 3px solid rgba(239,68,68,0.5); border-radius: 6px; white-space: pre-wrap; word-break: break-word; max-height: 200px; overflow-y: auto; }
        .jx-a .lbl { color: #fca5a5; font-weight: 900; margin-right: 5px; font-size: 11px; vertical-align: 2px; }
        .jx-input { width: 100%; border-radius: 10px; border: 1px solid rgba(148,163,184,0.3); background: rgba(255,255,255,0.06); color: #f8fafc; font-family: inherit; font-size: 14px; padding: 10px 12px; resize: vertical; min-height: 80px; line-height: 1.55; }
        .jx-input::placeholder { color: #64748b; font-size: 13px; }
        .jx-input:focus { outline: none; border-color: #818cf8; background: rgba(255,255,255,0.1); }
        .jx-actions { display: grid; grid-template-columns: 1fr; gap: 8px; margin-top: 10px; }
        .jx-actions-row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; margin-top: 8px; }
        .jx-actions-row .btn { padding: 11px 4px; font-size: 12px; }
        .btn { border: none; border-radius: 10px; padding: 12px 8px; font-family: inherit; font-size: 13px; font-weight: 800; cursor: pointer; transition: transform 0.1s, opacity 0.15s; }
        .btn:active { transform: scale(0.97); }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn-save { background: linear-gradient(135deg,#6366f1,#4f46e5); color: #fff; }
        .btn-mgr { background: rgba(245,158,11,0.15); color: #fcd34d; border: 1px solid rgba(245,158,11,0.35); }
        .btn-ok { background: rgba(34,197,94,0.15); color: #86efac; border: 1px solid rgba(34,197,94,0.35); }
        .btn-pass { background: rgba(255,255,255,0.05); color: #94a3b8; border: 1px solid rgba(148,163,184,0.2); }
        .btn-join { flex:1; background: linear-gradient(135deg,#16a34a,#15803d); color:#fff; }
        .btn-leave { background: rgba(239,68,68,0.15); color:#fca5a5; border:1px solid rgba(239,68,68,0.35); }
        .btn-send { background: linear-gradient(135deg,#34d399,#059669); color:#fff; min-width:70px; }
        .btn-file { background: rgba(148,163,184,0.15); color:#cbd5e1; border:1px solid rgba(148,163,184,0.3); min-width:52px; }
        .cmsg a.cfile { display:inline-block; margin-top:6px; padding:7px 11px; background:rgba(255,255,255,0.1); border-radius:8px; color:#93c5fd; text-decoration:none; font-size:12.5px; }
        .jx-status { font-size: 11px; color: #64748b; margin-top: 8px; min-height: 15px; padding: 0 2px; }
        .jx-status.busy { color: #c7d2fe; } .jx-status.ok { color: #86efac; } .jx-status.err { color: #fca5a5; }
        .fade-out { opacity: 0; transform: scale(0.95); }
        .toast { position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%) translateY(20px); background: #16a34a; color: #fff; padding: 13px 22px; border-radius: 14px; font-weight: 800; font-size: 14px; box-shadow: 0 10px 25px rgba(0,0,0,0.4); z-index: 10000; opacity: 0; transition: opacity 0.2s, transform 0.2s; pointer-events: none; max-width: 90vw; text-align: center; }
        .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
        .toast.err { background: #dc2626; }
        .footer { text-align: center; margin-top: 30px; font-size: 11px; color: #475569; }
        .footer a { color: #64748b; text-decoration: none; }

        /* 채팅방별 담당자 칩 + 클릭 시 아래로 펼쳐지는 드롭다운 */
        .room-mgr-wrap { position: relative; margin-top: 6px; }
        .room-mgr {
            display: inline-block; font-size: 11px; font-weight: 800; padding: 4px 9px; border-radius: 8px;
            background: rgba(148,163,184,0.15); color: #cbd5e1; cursor: pointer; white-space: nowrap; user-select: none;
        }
        .room-mgr.assigned { background: rgba(34,197,94,0.2); color: #86efac; }
        .room-mgr:hover { filter: brightness(1.15); }
        .room-mgr-dd {
            display: none; position: absolute; right: 0; top: 100%; margin-top: 5px; z-index: 200;
            background: #1e293b; border: 1px solid rgba(148,163,184,0.25); border-radius: 11px; padding: 6px;
            min-width: 150px; box-shadow: 0 16px 36px -10px rgba(0,0,0,0.7);
        }
        .room-mgr-dd.open { display: block; }
        .room-mgr-dd button {
            display: block; width: 100%; text-align: left; padding: 8px 11px; border-radius: 8px;
            background: none; border: none; color: #e2e8f0; font-size: 12.5px; font-weight: 700; cursor: pointer; font-family: inherit;
        }
        .room-mgr-dd button:hover { background: rgba(255,255,255,0.09); }
        .room-mgr-dd button.cur { background: rgba(34,197,94,0.18); color: #86efac; }
        .room-mgr-dd .dd-rel { color: #94a3b8; border-top: 1px solid rgba(148,163,184,0.15); margin-top: 4px; padding-top: 8px; }

        /* 2026-10-07: 바둑판 그리드(5열×3줄=15) + 페이지네이션 + 매니저별 보기 버튼 */
        #roomList { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; align-items: stretch; }
        @media (max-width: 900px){ #roomList { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
        @media (max-width: 460px){ #roomList { grid-template-columns: minmax(0, 1fr); } }
        #roomList .empty { grid-column: 1 / -1; }
        .room-tile {
            display: flex; flex-direction: column; justify-content: space-between; gap: 10px;
            padding: 13px 14px; min-height: 160px; min-width: 0;
            background: linear-gradient(165deg,#1e293b 0%,#0f172a 100%);
            border: 1px solid rgba(148,163,184,0.15); border-radius: 14px;
            transition: border-color 0.15s;
        }
        .room-tile.fresh { border-color: rgba(239,68,68,0.55); box-shadow: 0 0 0 1px rgba(239,68,68,0.35); }
        .rt-body { min-width: 0; overflow: hidden; flex: 1; }
        .rt-top { display: flex; align-items: center; gap: 6px; font-size: 11px; color: #64748b; margin-bottom: 7px; }
        .rt-prev { font-size: 13px; color: #cbd5e1; line-height: 1.5; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; word-break: break-word; }
        .rt-btns { display: flex; gap: 6px; align-items: stretch; }
        .rt-name-btn { flex: 1; min-width: 0; text-align: center; background: rgba(99,102,241,0.14); color: #c7d2fe; border: 1px solid rgba(99,102,241,0.3); border-radius: 10px; padding: 10px 8px; font-size: 13px; font-weight: 800; cursor: pointer; font-family: inherit; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .rt-name-btn:hover { background: rgba(99,102,241,0.24); }
        .room-tile .room-mgr-wrap { flex: 1; min-width: 0; margin-top: 0; }
        .room-tile .room-mgr { display: block; width: 100%; box-sizing: border-box; text-align: center; padding: 10px 8px; font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .rt-row2 { display: flex; align-items: center; justify-content: space-between; gap: 6px; margin-top: 2px; }
        .rt-phone { font-size: 12px; color: #93c5fd; text-decoration: none; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
        .rt-phone.rt-phone-none { color: #64748b; }
        .rt-consult { flex-shrink: 0; background: rgba(34,197,94,0.18); color: #86efac; border: 1px solid rgba(34,197,94,0.35); border-radius: 9px; padding: 7px 14px; font-size: 12px; font-weight: 800; cursor: pointer; font-family: inherit; }
        .rt-consult:hover { background: rgba(34,197,94,0.28); }

        .mgr-filter-bar { display: flex; flex-wrap: wrap; gap: 7px; padding: 10px 14px 12px; align-items: center; border-bottom: 1px solid rgba(148,163,184,0.12); }
        .mgr-filter-bar .mflabel { font-size: 12px; color: #94a3b8; margin-right: 2px; }
        .mgr-filter-btn {
            font-size: 12.5px; font-weight: 800; padding: 7px 13px; border-radius: 20px; cursor: pointer; font-family: inherit;
            background: rgba(255,255,255,0.05); color: #cbd5e1; border: 1px solid rgba(148,163,184,0.2); transition: all 0.12s;
        }
        .mgr-filter-btn:hover { filter: brightness(1.2); }
        .mgr-filter-btn.active { background: linear-gradient(135deg,#6366f1,#4f46e5); color: #fff; border-color: transparent; }

        .room-pager { display: flex; justify-content: center; align-items: center; gap: 6px; flex-wrap: wrap; margin: 18px 0 6px; }
        .room-pager button {
            min-width: 34px; height: 34px; padding: 0 9px; border-radius: 9px; cursor: pointer; font-family: inherit;
            font-size: 13px; font-weight: 800; background: rgba(255,255,255,0.05); color: #cbd5e1; border: 1px solid rgba(148,163,184,0.2);
        }
        .room-pager button:hover { filter: brightness(1.2); }
        .room-pager button.cur { background: linear-gradient(135deg,#6366f1,#4f46e5); color: #fff; border-color: transparent; }
        .room-pager button:disabled { opacity: 0.35; cursor: not-allowed; }
    </style>
</head>
<body>

    <div class="header">
        <div style="flex:1;">
            <h1>🤖 자비스 · 실시간 채팅관리</h1>
            <div class="sub">라이브 상담 개입 · AI 학습 · <span id="meLabel">-</span></div>
        </div>
        <select id="mgrSelect" onchange="onMgrChange()" title="상담 매니저 선택" style="height:40px; border-radius:12px; background:rgba(255,255,255,0.06); border:1px solid rgba(148,163,184,0.2); color:#e2e8f0; font-family:inherit; font-size:13px; font-weight:700; padding:0 8px; cursor:pointer; max-width:120px;"></select>
        <button class="alarm-btn on" id="alarmBtn" onclick="toggleAlarm()" title="채팅 알람">🔔 <span id="alarmLbl">알람 켜짐</span></button>
        <button class="refresh-btn" onclick="reloadAll()" title="새로고침">↻</button>
    </div>

    <div class="tabs">
        <div class="tab active" id="tabLive" onclick="switchTab('live')">🔴 실시간 채팅 <span class="tcount" id="liveCount"></span><span id="liveDot"></span></div>
        <div class="tab" id="tabLearn" onclick="switchTab('learn')">🧠 AI 학습 <span class="tcount" id="learnCount"></span></div>
    </div>

    <!-- 라이브 패널 -->
    <div id="livePanel">
        <div class="mgr-filter-bar" id="roomFilterBar"><span class="mflabel">매니저별 보기</span></div>
        <div id="roomList"><div class="empty" style="color:#64748b; font-weight:600;">불러오는 중...</div></div>
        <div class="room-pager" id="roomPager"></div>
    </div>

    <!-- 학습 패널 -->
    <div id="learnPanel" style="display:none;">
        <div class="summary">
            <span class="chip" id="dateChip">-</span>
            <span class="chip warn" id="countChip">- 건</span>
        </div>
        <div id="list"><div style="text-align:center; color:#64748b; padding:40px 0;">불러오는 중...</div></div>
    </div>

    <div class="footer"><a href="/order_management">← 통합 주문 관리</a> · <a href="/admin_m_secret_882">관리자 대시보드</a></div>

    <!-- 대화 오버레이 -->
    <div class="conv-ov" id="convOv">
        <div class="conv-card">
            <div class="conv-head">
                <div class="cn" id="convName">고객</div>
                <button class="cx" onclick="closeConv()">×</button>
            </div>
            <div class="conv-body" id="convBody"></div>
            <div class="conv-foot">
                <div class="join-bar" id="joinBar">
                    <button class="btn btn-join" id="joinBtn" onclick="managerJoin()">🙋 매니저 참여 (직접 답변)</button>
                </div>
                <div class="reply-wrap" id="replyWrap">
                    <input type="file" id="replyFile" style="display:none" onchange="if(this.files[0])managerSendFile(this.files[0]); this.value='';">
                    <button class="btn btn-file" onclick="document.getElementById('replyFile').click()" title="이미지·파일 첨부 (최대 20MB)">첨부</button>
                    <textarea class="reply-ta" id="replyTa" placeholder="고객에게 보낼 답변 입력... (이미지 붙여넣기 가능)" onpaste="managerPaste(event)" onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();managerSend();}"></textarea>
                    <button class="btn btn-send" onclick="managerSend()">보내기</button>
                    <button class="btn btn-leave" onclick="managerLeave()" title="AI 재개">AI 재개</button>
                </div>
            </div>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script type="module">
        import { sb, initConfig } from './config.js?v=446';

        let ME = '관리자';
        let ALARM_ON = (localStorage.getItem('chatAlarmOn') !== '0');
        let _globalSub = null, _roomSub = null;
        let _curRoom = null;          // {id, name, human_active}
        let _curRoomMgrSent = false;  // 이 방에서 매니저가 답을 보냈는가(→ 닫을 때 자동 증류 학습)
        let _roomsCache = [];
        let _freshRooms = {};         // roomId -> true (새 고객메시지 미확인)
        let _reloadRoomsTimer = null;
        let _staffList = [];          // admin_staff (id,name,role) — 담당 매니저 id 매칭용
        let _roomFilter = '';         // 담당 매니저 필터 ('' = 전체, '__none__' = 미지정)
        let _roomPage = 0;            // 방 목록 페이지 (0-based)
        const ROOMS_PER_PAGE = 12;    // 바둑판 4칸 × 3줄

        // ── 공통 유틸 ──
        function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
        // 2026-09-30(사장님): 제품 추천(<!--PRODUCTS:...-->)을 이미지 카드로. 텍스트에서 주석 제거 후 카드 HTML 반환.
        function _extractProducts(raw){
            raw = String(raw==null?'':raw);
            var cards = '';
            raw = raw.replace(/<!--PRODUCTS:([\s\S]*?)-->/g, function(_, json){
                try {
                    var arr = JSON.parse(json) || [];
                    var items = arr.map(function(p){
                        if(!p || !p.code) return '';
                        var url = 'https://www.cafe2626.com/?product=' + encodeURIComponent(p.code);
                        var img = (p.img && /^https?:/.test(p.img)) ? '<img src="'+esc(p.img)+'" alt="" style="width:100%;height:110px;object-fit:cover;display:block;" onerror="this.style.display=\'none\'">' : '';
                        return '<a href="'+esc(url)+'" target="_blank" rel="noopener" style="display:block;width:150px;border:1px solid #e5e7eb;border-radius:10px;overflow:hidden;text-decoration:none;color:#1f2937;background:#fff;">'
                            + img
                            + '<div style="padding:7px 9px;"><div style="font-size:12px;font-weight:600;line-height:1.4;">'+esc(p.name||p.code)+'</div>'
                            + (p.price?('<div style="font-size:11px;color:#6366f1;margin-top:2px;">'+esc(p.price)+'</div>'):'')
                            + '<div style="font-size:11px;color:#6366f1;margin-top:3px;">제품 보기 ›</div></div></a>';
                    }).join('');
                    if(items) cards += '<div style="display:flex;flex-wrap:wrap;gap:8px;margin-top:8px;">'+items+'</div>';
                } catch(e) {}
                return '';
            });
            return { text: raw, cards: cards };
        }
        // 메시지 속 제품링크·견적PDF·URL·마크다운링크 를 클릭 가능한 짧은 링크로 (긴 raw URL 방지)
        function _linkify(raw){
            raw = String(raw==null?'':raw).replace(/\*\*/g,'');   // 굵게 마커 제거
            var re = /\[QUOTE_PDF:([^\]]+)\]|\[([^\]]+)\]\(([^)\s]+)\)|(https?:\/\/[^\s<]+)|(\/\?product=[A-Za-z0-9_%\-]+)/g;
            var out='', last=0, m;
            function anchor(url,label,color){ return '<a href="'+esc(url)+'" target="_blank" rel="noopener" style="color:'+color+';text-decoration:underline;">'+esc(label)+'</a>'; }
            while((m=re.exec(raw))){
                out += esc(raw.slice(last, m.index));
                if(m[1]){ out += anchor(m[1],'📄 견적서 PDF','#0891b2'); }
                else if(m[2]!=null && m[3]){ var u3=/^\//.test(m[3])?(location.origin+m[3]):m[3]; out += anchor(u3, m[2], '#6366f1'); }
                else { var url = m[4] || (location.origin + m[5]); var isProd = /[?&]product=/.test(url); out += anchor(url, isProd?'🔗 제품 보기':(url.length>42?url.slice(0,39)+'…':url), '#6366f1'); }
                last = re.lastIndex;
            }
            out += esc(raw.slice(last));
            return out;
        }
        function _previewText(msg){
            return String(msg==null?'':msg)
                .replace(/<!--PRODUCTS:[\s\S]*?-->/g,' [제품 추천]')
                .replace(/\*\*/g,'')
                .replace(/\[QUOTE_PDF:[^\]]+\]/g,'[견적서]')
                .replace(/https?:\/\/[^\s<]*[?&]product=[^\s<]*/g,'[제품 링크]')
                .replace(/\/\?product=[A-Za-z0-9_%\-]+/g,'[제품 링크]')
                .replace(/https?:\/\/[^\s<]+/g,'[링크]');
        }
        function fmtTime(iso){ try{ const d=new Date(iso); const m=('0'+(d.getMonth()+1)).slice(-2),dd=('0'+d.getDate()).slice(-2),h=('0'+d.getHours()).slice(-2),mi=('0'+d.getMinutes()).slice(-2); return `${m}/${dd} ${h}:${mi}`; }catch(e){return '';} }
        function fmtAgo(iso){ try{ const s=Math.floor((Date.now()-new Date(iso).getTime())/1000); if(s<60)return '방금'; if(s<3600)return Math.floor(s/60)+'분전'; if(s<86400)return Math.floor(s/3600)+'시간전'; return fmtTime(iso);}catch(e){return '';} }
        function toast(msg,isErr){ const t=document.getElementById('toast'); t.textContent=msg; t.className='toast show'+(isErr?' err':''); setTimeout(()=>{t.className='toast'+(isErr?' err':'');},2600); }
        function beep(){ if(!ALARM_ON)return; try{ const ac=new (window.AudioContext||window.webkitAudioContext)(); const o=ac.createOscillator(),g=ac.createGain(); o.connect(g); g.connect(ac.destination); o.type='sine'; o.frequency.value=880; g.gain.setValueAtTime(0.0001,ac.currentTime); g.gain.exponentialRampToValueAtTime(0.12,ac.currentTime+0.02); g.gain.exponentialRampToValueAtTime(0.0001,ac.currentTime+0.35); o.start(); o.stop(ac.currentTime+0.36); setTimeout(()=>{try{ac.close();}catch(e){}},500); }catch(e){} }
        function notify(title,body){ if(!ALARM_ON)return; try{ if(window.Notification && Notification.permission==='granted'){ new Notification(title,{body:body,icon:'/mascot-character.png'}); } }catch(e){} }

        // ── 알람 토글 ──
        window.toggleAlarm = function(){
            ALARM_ON = !ALARM_ON;
            localStorage.setItem('chatAlarmOn', ALARM_ON?'1':'0');
            const b=document.getElementById('alarmBtn'); const l=document.getElementById('alarmLbl');
            b.className='alarm-btn '+(ALARM_ON?'on':'off'); l.textContent=ALARM_ON?'알람 켜짐':'알람 꺼짐';
            b.firstChild.textContent = ALARM_ON?'🔔 ':'🔕 ';
            if(ALARM_ON){ try{ if(window.Notification && Notification.permission==='default') Notification.requestPermission(); }catch(e){} beep(); }
        };
        function paintAlarm(){ const b=document.getElementById('alarmBtn'),l=document.getElementById('alarmLbl'); b.className='alarm-btn '+(ALARM_ON?'on':'off'); l.textContent=ALARM_ON?'알람 켜짐':'알람 꺼짐'; b.firstChild.textContent=ALARM_ON?'🔔 ':'🔕 '; }

        // ── 탭 ──
        window.switchTab = function(which){
            document.getElementById('tabLive').classList.toggle('active', which==='live');
            document.getElementById('tabLearn').classList.toggle('active', which==='learn');
            document.getElementById('livePanel').style.display = which==='live'?'':'none';
            document.getElementById('learnPanel').style.display = which==='learn'?'':'none';
            if(which==='learn') loadJarvis();
            else loadRooms();
        };
        window.reloadAll = function(){ loadRooms(); if(document.getElementById('learnPanel').style.display!=='none') loadJarvis(); };

        // ════════════════ 라이브 방 목록 ════════════════
        window.loadRooms = async function(){
            const el=document.getElementById('roomList');
            try{
                const { data: rooms, error } = await sb.from('chat_rooms')
                    .select('id, customer_name, nickname, customer_phone, site_lang, status, human_active, assigned_manager, updated_at')
                    .order('updated_at',{ascending:false}).limit(60);
                if(error) throw error;
                _roomsCache = rooms||[];
                // 각 방 마지막 메시지 프리뷰 — 최근 메시지 일괄 조회
                const ids=_roomsCache.map(r=>r.id);
                let lastMap={};
                if(ids.length){
                    const { data: msgs } = await sb.from('chat_messages')
                        .select('room_id, sender_type, message, created_at')
                        .in('room_id', ids).order('created_at',{ascending:false}).limit(300);
                    (msgs||[]).forEach(m=>{ if(!lastMap[m.room_id]) lastMap[m.room_id]=m; });
                }
                // 담당 매니저 필터 적용 (_roomsCache 는 전체 유지, 렌더만 필터)
                let _view = _roomsCache;
                if(_roomFilter==='__none__') _view = _roomsCache.filter(r=>!((r.assigned_manager||'').trim()));
                else if(_roomFilter) _view = _roomsCache.filter(r=>{ const am=(r.assigned_manager||'').trim(); return !!am && (am===_roomFilter || am.includes(_roomFilter) || _roomFilter.includes(am)); });
                document.getElementById('liveCount').textContent = _view.length ? '('+_view.length+(_roomFilter?' / '+_roomsCache.length:'')+')' : '';
                buildRoomFilter();
                if(!_view.length){ el.innerHTML='<div class="empty" style="color:#64748b; font-weight:600;">'+(_roomFilter?'이 담당의 채팅방이 없습니다.':'아직 대화가 없습니다.')+'</div>'; renderRoomPager(0); return; }
                // 페이지네이션 (15개/페이지)
                const totalPages = Math.max(1, Math.ceil(_view.length / ROOMS_PER_PAGE));
                if(_roomPage >= totalPages) _roomPage = totalPages - 1;
                if(_roomPage < 0) _roomPage = 0;
                const pageRooms = _view.slice(_roomPage*ROOMS_PER_PAGE, _roomPage*ROOMS_PER_PAGE + ROOMS_PER_PAGE);
                el.innerHTML = pageRooms.map(r=>{
                    const rawNm = (r.customer_name||r.nickname||'게스트');
                    let phone = (r.customer_phone||'').trim();
                    if(!phone && rawNm.indexOf('|')>=0) phone = rawNm.split('|')[1].trim();
                    const nm = (rawNm.split('|')[0].trim()) || '게스트';
                    const lm = lastMap[r.id];
                    const prev = lm ? ((lm.sender_type==='customer'?'👤 ':(String(lm.sender_name||'').includes('관리자')?'🙋 ':'🤖 '))+_previewText(lm.message).slice(0,90)) : '';
                    const fresh = _freshRooms[r.id];
                    const am = (r.assigned_manager||'').trim();
                    const chip = `<span class="room-mgr ${am?'assigned':''}" onclick="event.stopPropagation(); toggleRoomMgr('${r.id}')">${am?('👤 '+esc(am)+(r.human_active?' 상담중':'')):'담당 지정'} ▾</span>`;
                    const nmArg = JSON.stringify(esc(nm)).replace(/"/g,'&quot;');
                    // 담당매니저 지정 시 타일 전체를 그 매니저 고유색으로 (미지정은 기본색)
                    const _col = _mgrColor(am);
                    const _tileStyle = _col ? ` style="background:linear-gradient(160deg, ${_mix(_col,0.62)} 0%, ${_mix(_col,0.34)} 100%); border-color:${_col}; box-shadow:inset 0 0 0 1px ${_col}66;"` : '';
                    return `<div class="room-tile ${fresh?'fresh':''}"${_tileStyle}>
                        <div class="rt-body">
                            <div class="rt-top">${esc(fmtAgo(r.updated_at))} ${fresh?'<span class="badge-new">NEW</span>':''}</div>
                            <div class="rt-prev">${esc(prev)}</div>
                        </div>
                        <div class="rt-btns">
                            <button class="rt-name-btn" onclick="openConv('${r.id}', ${nmArg})">${esc(nm)}</button>
                            <div class="room-mgr-wrap">${chip}<div class="room-mgr-dd" id="rmdd-${r.id}" onclick="event.stopPropagation()">${mgrDdOptions(r.id, am)}</div></div>
                        </div>
                        <div class="rt-row2">
                            ${phone?`<a class="rt-phone" href="tel:${esc(phone.replace(/[^0-9+]/g,''))}" onclick="event.stopPropagation()">📞 ${esc(phone)}</a>`:`<span class="rt-phone rt-phone-none">번호 없음</span>`}
                            <button class="rt-consult" onclick="openConv('${r.id}', ${nmArg})">상담하기</button>
                        </div>
                    </div>`;
                }).join('');
                renderRoomPager(totalPages);
            }catch(e){ console.error('[rooms]',e); el.innerHTML='<div style="text-align:center;color:#fca5a5;padding:40px 0;">불러오기 실패: '+esc(e?.message||e)+'</div>'; }
        };
        function scheduleRoomsReload(){ clearTimeout(_reloadRoomsTimer); _reloadRoomsTimer=setTimeout(loadRooms, 600); }

        // 채팅방별 담당자 드롭다운 (클릭하면 아래로 펼쳐짐)
        //   2026-10-07(사장님): 실제 매니저 + '본사 지정'만 (로그인 계정 이메일 이름 제외)
        function mgrDdOptions(roomId, current){
            const names = (_roomMgrNames && _roomMgrNames.length) ? _roomMgrNames : ['지숙','성희','혜림','동연','연두'];
            const list = ['본사'].concat(names.filter(n=>n!=='본사'));
            let h = list.map(n=>{ const lbl = (n==='본사') ? '🏢 본사 지정' : esc(n); return `<button class="${n===current?'cur':''}" onclick="assignRoomMgr('${roomId}', ${JSON.stringify(esc(n)).replace(/"/g,'&quot;')})">${lbl}${n===current?' ✓':''}</button>`; }).join('');
            h += `<button class="dd-rel" onclick="assignRoomMgr('${roomId}','')">🤖 AI 에게 맡김 (해제)</button>`;
            return h;
        }
        window.toggleRoomMgr = function(roomId){
            const dd = document.getElementById('rmdd-'+roomId);
            const wasOpen = dd && dd.classList.contains('open');
            document.querySelectorAll('.room-mgr-dd.open').forEach(d=>d.classList.remove('open'));
            if(dd && !wasOpen) dd.classList.add('open');
        };
        // 담당매니저 이름 → admin_staff.id 매칭 (admin_staff.name 이 풀네임이어도 조각 매칭: '조지숙' ⊃ '지숙')
        function _resolveStaffId(name){
            name=(name||'').trim(); if(!name) return null;
            let hit = _staffList.find(s=>String(s.name||'').trim()===name);
            if(!hit) hit = _staffList.find(s=>{ const sn=String(s.name||'').trim(); return sn && (sn.includes(name)||name.includes(sn)); });
            return hit ? hit.id : null;
        }
        function _normPhone(p){ return String(p==null?'':p).replace(/[^0-9]/g,''); }
        // 2026-10-07(사장님): 담당매니저별 고유색 — admin_staff.color 우선, 없으면 이름해시 팔레트. 본사=별도색.
        const _MGR_PALETTE = ['#ef4444','#f59e0b','#10b981','#3b82f6','#a855f7','#ec4899','#14b8a6','#f97316','#eab308','#06b6d4'];
        function _mgrColor(name){
            name=(name||'').trim(); if(!name) return null;
            if(name==='본사') return '#64748b';
            let s = _staffList.find(x=>String(x.name||'').trim()===name);
            if(!s) s = _staffList.find(x=>{ const sn=String(x.name||'').trim(); return sn && (sn.includes(name)||name.includes(sn)); });
            if(s && s.color && /^#?[0-9a-fA-F]{3,8}$/.test(String(s.color).replace('#',''))) { const c=String(s.color); return c[0]==='#'?c:('#'+c); }
            let h=0; for(let i=0;i<name.length;i++) h=(h*31+name.charCodeAt(i))>>>0;
            return _MGR_PALETTE[h % _MGR_PALETTE.length];
        }
        // 매니저색을 어두운 배경(#0f172a)과 섞어 진한 타일 배경 생성 (밝은 글씨 가독성 유지). pct=색 비중(0~1)
        function _mix(hex, pct){
            hex=String(hex||'').replace('#',''); if(hex.length===3) hex=hex.split('').map(c=>c+c).join('');
            const r=parseInt(hex.slice(0,2),16)||100, g=parseInt(hex.slice(2,4),16)||116, b=parseInt(hex.slice(4,6),16)||139;
            const dr=15,dg=23,db=42;
            return 'rgb('+Math.round(r*pct+dr*(1-pct))+','+Math.round(g*pct+dg*(1-pct))+','+Math.round(b*pct+db*(1-pct))+')';
        }
        window.assignRoomMgr = async function(roomId, name){
            name=(name||'').trim();
            const dd=document.getElementById('rmdd-'+roomId); if(dd) dd.classList.remove('open');
            const room = _roomsCache.find(r=>String(r.id)===String(roomId)) || null;
            const phoneNorm = _normPhone(room && room.customer_phone);
            const custName = room ? (room.customer_name||room.nickname||'') : '';
            try{
                if(name){
                    const sid = _resolveStaffId(name);
                    // (1) 핵심 배정 — 기존 동작 (SQL 미실행 상태에서도 반드시 성공해야 함)
                    await sb.from('chat_rooms').update({ assigned_manager:name, human_active:true, status:'human' }).eq('id',roomId);
                    // (2) 직원ID 링크 — staff_manager_id 컬럼이 아직 없으면 조용히 skip (SQL 미실행 대비)
                    try{ await sb.from('chat_rooms').update({ staff_manager_id:sid }).eq('id',roomId); }catch(e){ console.warn('[staff_manager_id]',e); }
                    // (3) 고객 귀속 (전화번호 기준) — 매니저 직원ID + 전화번호가 있을 때만
                    if(sid && phoneNorm.length>=9){
                        let owned=false;
                        try{ const { error } = await sb.from('manager_customers').upsert({ phone_norm:phoneNorm, staff_manager_id:sid, manager_name:name, customer_name:custName, source_room_id:String(roomId), updated_at:new Date().toISOString() }, { onConflict:'phone_norm' }); if(!error) owned=true; }catch(e){ console.warn('[ownership upsert]',e); }
                        let back=0; try{ const { data } = await sb.rpc('attribute_customer_orders',{ p_phone_norm:phoneNorm, p_staff_id:sid }); back = (typeof data==='number')?data:0; }catch(e){ console.warn('[backfill]',e); }
                        if(owned) toast('👤 '+name+' 담당 지정 · 고객 귀속'+(back?(' (기존주문 '+back+'건)'):'')+' · AI 정지');
                        else toast('👤 '+name+' 담당 지정 (귀속 테이블 미생성 — SQL 실행 필요)', true);
                    } else if(sid){
                        toast('👤 '+name+' 담당 지정 (전화번호 없어 고객 귀속 보류)', true);
                    } else {
                        toast('👤 '+name+' 담당 지정 (직원DB 매칭 안됨 — 귀속 보류)', true);
                    }
                } else {
                    // 해제 — 핵심 먼저, 링크/귀속은 best-effort
                    await sb.from('chat_rooms').update({ assigned_manager:'', human_active:false, status:'open' }).eq('id',roomId);
                    try{ await sb.from('chat_rooms').update({ staff_manager_id:null }).eq('id',roomId); }catch(e){}
                    if(phoneNorm.length>=9){ try{ await sb.from('manager_customers').delete().eq('phone_norm',phoneNorm); }catch(e){ console.warn('[ownership delete]',e); } }
                    toast('🤖 AI 에게 맡김 (고객 귀속 해제)');
                }
            }catch(e){ toast('지정 실패: '+(e?.message||e), true); return; }
            if(_curRoom && _curRoom.id===roomId){ _curRoom.assigned_manager=name; _curRoom.human_active=!!name; paintJoinBar(); }
            loadRooms();
        };
        // 바깥 클릭 → 열린 드롭다운 닫기
        document.addEventListener('click', function(){ document.querySelectorAll('.room-mgr-dd.open').forEach(d=>d.classList.remove('open')); });

        // ════════════════ 대화 열기 ════════════════
        window.openConv = async function(roomId, name){
            _curRoom = { id: roomId, name: name||'고객', human_active:false, assigned_manager:'' };
            _curRoomMgrSent = false;
            delete _freshRooms[roomId];
            document.getElementById('convName').textContent = name||'고객';
            document.getElementById('convBody').innerHTML = '<div style="text-align:center;color:#64748b;padding:30px;">불러오는 중...</div>';
            document.getElementById('convOv').classList.add('open');
            // 방 상태
            try{ const { data: rm } = await sb.from('chat_rooms').select('human_active, assigned_manager, customer_name, nickname').eq('id',roomId).maybeSingle(); if(rm){ _curRoom.human_active=!!rm.human_active; _curRoom.assigned_manager=(rm.assigned_manager||''); const _cn=(name||rm.customer_name||rm.nickname||'고객'); document.getElementById('convName').textContent = _cn + (_curRoom.assigned_manager?('  ·  👤 '+_curRoom.assigned_manager):''); } }catch(e){}
            await renderConvMessages(roomId);
            paintJoinBar();
            subscribeRoom(roomId);
        };
        async function renderConvMessages(roomId){
            const body=document.getElementById('convBody');
            try{
                const { data: msgs, error } = await sb.from('chat_messages')
                    .select('sender_type, sender_name, message, file_url, file_name, file_type, created_at')
                    .eq('room_id',roomId).order('created_at',{ascending:true}).limit(500);
                if(error) throw error;
                body.innerHTML = (msgs||[]).map(convBubble).join('') || '<div style="text-align:center;color:#64748b;padding:30px;">메시지가 없습니다.</div>';
                body.scrollTop = body.scrollHeight;
            }catch(e){ body.innerHTML='<div style="text-align:center;color:#fca5a5;padding:30px;">'+esc(e?.message||e)+'</div>'; }
        }
        function convBubble(m){
            const isCust = m.sender_type==='customer';
            const isMgr = !isCust && String(m.sender_name||'').includes('관리자');
            const cls = isCust?'customer':(isMgr?'mgr':'ai');

            if(!confirm('이 상담은 코드 수정 / 별도 처리 건으로 패스합니다. (AI 학습 없이 목록에서 제거)\n진행할까요?')) return;
            const item=document.getElementById('jx-'+id);
            try{ const {data:row}=await sb.from('advisor_qa_log').select('room_id').eq('id',id).maybeSingle(); const upd={ needs_learning:false, is_reviewed:true, reviewed_at:new Date().toISOString(), admin_answer:'[PASS · 코드 수정 필요]', admin_answer_ko:'[PASS · 코드 수정 필요]' }; if(row&&row.room_id) await sb.from('advisor_qa_log').update(upd).eq('room_id',row.room_id); else await sb.from('advisor_qa_log').update(upd).eq('id',id); toast('⏭ 패스 처리됨'); if(item){ item.classList.add('fade-out'); setTimeout(()=>{item.remove(); updateCount();},380); } }catch(e){ toast('처리 실패: '+(e?.message||e),true); }
        };

        function updateCount(){ const countEl=document.getElementById('countChip'); const remaining=document.querySelectorAll('.jx-item').length; countEl.textContent=remaining?remaining+' 건':'0 건'; countEl.className='chip '+(remaining?'warn':'ok'); document.getElementById('learnCount').textContent=remaining?'('+remaining+')':''; if(!remaining){ document.getElementById('list').innerHTML='<div class="empty">✅ 모든 상담을 처리했습니다.<br>깔끔합니다!</div>'; } }

        // ── 상담 매니저 이름 선택 (헤더 드롭다운 + 우측 패널 연동) ──
        let _acctName = '관리자';
        let _mgrNames = [];
        let _roomMgrNames = [];   // 2026-10-07: 방 담당지정/필터용 — 실제 매니저만(계정이름 제외)
        function paintMe(){ document.getElementById('meLabel').textContent = '상담 매니저: ' + ME; }
        function repaintMgrUI(){
            const sel = document.getElementById('mgrSelect');
            if(sel){ if(![...sel.options].some(o=>o.value===ME)){ const o=document.createElement('option'); o.value=ME; o.textContent=ME; sel.insertBefore(o, sel.firstChild); } sel.value=ME; }
            document.querySelectorAll('.mgr-pick').forEach(b=>b.classList.toggle('active', b.dataset.name===ME));
        }
        window.setManager = function(name){
            name=(name||'').trim(); if(!name) return;
            ME=name; try{ localStorage.setItem('jarvisMgrName', ME); }catch(e){}
            // 2026-10-07(사장님): 본인(매니저) 선택 시 자기 담당 방만 보기(미배정 제외). 본사는 전체.
            _roomFilter = (name==='본사') ? '' : name;
            _roomPage = 0;
            paintMe(); repaintMgrUI(); toast('상담 매니저: ' + ME + (name!=='본사' ? ' — 내 담당만 보기' : ''));
            loadRooms();
        };
        async function buildMgrUI(){
            let names = [];
            try{ const { data } = await sb.from('chatbot_knowledge').select('question,is_active').eq('category','_managers'); names = (data||[]).filter(m=>m.is_active!==false).map(m=>(m.question||'').trim()).filter(Boolean); }catch(e){}
            if(!names.length) names = ['지숙','성희','혜림','동연','연두'];   // 폴백
            _roomMgrNames = names.slice();   // 방 담당지정/필터용 (실 매니저)
            // 2026-10-07(사장님): 상담 매니저 선택 = '본사' + 실매니저 (로그인 계정 이메일 이름 제외)
            const opts = ['본사'].concat(names.filter(n=>n!=='본사'));
            _mgrNames = opts;
            // ME 보정 — opts 에 없는(이메일 접두사 등) 이름이면 '본사'로
            if(!opts.includes(ME)){ ME = '본사'; try{ localStorage.setItem('jarvisMgrName', ME); }catch(e){} }
            const sel = document.getElementById('mgrSelect');
            if(sel){ sel.innerHTML = opts.map(n=>`<option value="${n.replace(/"/g,'&quot;')}">${n}</option>`).join('') + '<option value="__custom__">✏ 직접 입력…</option>'; sel.value=ME; }
            const list = document.getElementById('mgrPickList');
            if(list){ list.innerHTML = opts.map(n=>`<button class="mgr-pick" data-name="${n.replace(/"/g,'&quot;')}" onclick="setManager(this.dataset.name)">${n}</button>`).join('') + `<button class="mgr-pick" style="opacity:.85;" onclick="onMgrCustom()">✏ 직접 입력…</button>`; }
            buildRoomFilter();
            repaintMgrUI();
        }
        // 방 목록 담당 매니저 필터 — 버튼형 (매니저별 보기)
        window.onRoomFilter = function(val){ _roomFilter = val||''; _roomPage = 0; loadRooms(); };
        function buildRoomFilter(){
            const bar=document.getElementById('roomFilterBar'); if(!bar) return;
            const names = ['본사'].concat((_roomMgrNames||[]).filter(n=>n!=='본사'));
            const btn = (val,label)=>`<button class="mgr-filter-btn ${_roomFilter===val?'active':''}" onclick="onRoomFilter(${JSON.stringify(val).replace(/"/g,'&quot;')})">${esc(label)}</button>`;
            let h = '<span class="mflabel">매니저별 보기</span>' + btn('','전체');
            names.forEach(n=>{ h += btn(n, n); });
            h += btn('__none__','미지정');
            bar.innerHTML = h;
        }
        // 페이지네이션 렌더
        window._roomGo = function(p){ _roomPage = p; loadRooms(); };
        function renderRoomPager(totalPages){
            const pg=document.getElementById('roomPager'); if(!pg) return;
            if(totalPages<=1){ pg.innerHTML=''; return; }
            let h = `<button ${_roomPage<=0?'disabled':''} onclick="_roomGo(${_roomPage-1})">‹</button>`;
            for(let i=0;i<totalPages;i++){ h += `<button class="${i===_roomPage?'cur':''}" onclick="_roomGo(${i})">${i+1}</button>`; }
            h += `<button ${_roomPage>=totalPages-1?'disabled':''} onclick="_roomGo(${_roomPage+1})">›</button>`;
            pg.innerHTML = h;
        }
        window.onMgrChange = function(){ const sel=document.getElementById('mgrSelect'); const v=sel.value; if(v==='__custom__'){ onMgrCustom(); return; } setManager(v); };
        window.onMgrCustom = function(){ const c=(prompt('상담 매니저 이름을 입력하세요','')||'').trim(); if(c){ if(!_mgrNames.includes(c)){ _mgrNames.push(c); buildMgrUI().then(()=>setManager(c)); } else setManager(c); } else repaintMgrUI(); };

        window.addEventListener('DOMContentLoaded', async ()=>{
            await initConfig();
            try{ const u=await sb.auth.getUser(); const em=u&&u.data&&u.data.user&&u.data.user.email; if(em){ _acctName = em.split('@')[0]; } }catch(e){}
            // 저장된 선택 우선, 없으면 계정명
            ME = (localStorage.getItem('jarvisMgrName') || _acctName || '관리자');
            try{ const { data } = await sb.from('admin_staff').select('id,name,role,color'); _staffList = (data||[]).filter(s=>s.role==='manager'); }catch(e){ console.warn('[admin_staff]',e); }
            await buildMgrUI();
            paintMe();
            paintAlarm();
            try{ if(ALARM_ON && window.Notification && Notification.permission==='default') Notification.requestPermission(); }catch(e){}
            loadRooms();
            subscribeGlobal();
        });
    </script>
</body>
</html>
